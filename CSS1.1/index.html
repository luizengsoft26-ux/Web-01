<!--arquivo html com listas e tabelas para segunda avaliação web1 de CSS-->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS em Listas e Tabelas</title>
    <link rel="stylesheet" href="estilo.css">
</head>
<body>
    <h2>Exemplo de listas</h2>
    <ul class="lista1">
        <li>Item com marcador quadrado</li>
        <li>Outro item</li>
    <br>
    <ol class="lista2">
    <li>Primeiro item em algarismo romano</li>
    <li>Segundo item</li>
    </ol>
    <ul class="lista1">
        <li>Item com marcador de imagem</li>
        <li>mais um item</li>
    </ul>  
    <h2>Exemplo de tabelas</h2>
    <table class="tabela">
        <tr>
            <th>Nome</th>
            <th>Idade</th>
            <th>Cidade</th>
        </tr>
        <tr>
            <td>João</td>
            <td>25</td>
            <td>Salvador</td>
        </tr>
        <tr>
            <td>Pedro</td>
            <td>30</td>
            <td>Recife</td>
        </tr> 
        <tr>
            <td>Maria</td>
            <td>28</td>
            <td>Fortaleza</td>
</body>
</html>
